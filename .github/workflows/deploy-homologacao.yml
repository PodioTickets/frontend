name: Deploy Homologação

on:
  push:
    branches: [homologacao]

jobs:
  deploy:
    name: Deploy to VPS Homologação
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script_stop: true
          script: |
            set -e
            echo "🚀 Iniciando deploy homologação frontend..."

            cd /home/deploy/podiotickets-frontend

            echo "📥 Atualizando código..."
            # Salva o .env antes do reset
            [ -f .env ] && cp .env /tmp/frontend-env-backup
            git fetch origin
            git reset --hard origin/homologacao
            # Restaura o .env
            [ -f /tmp/frontend-env-backup ] && cp /tmp/frontend-env-backup .env

            echo "🔨 Fazendo build..."
            DOCKER_BUILDKIT=1 docker compose build frontend

            echo "🚀 Subindo container..."
            docker compose up -d --remove-orphans

            docker image prune -f

            echo "📋 Status:"
            docker compose ps

            echo "✅ Deploy concluído!"
