name: Deploy Homologação

on:
  push:
    branches: [homologacao]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: podiotickets/podiotickets-frontend-homolog

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.HOMOLOG_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_ORGANIZER_APP_HOST=${{ secrets.HOMOLOG_NEXT_PUBLIC_ORGANIZER_APP_HOST }}
            NEXT_PUBLIC_ROOT_SITE_URL=${{ secrets.HOMOLOG_NEXT_PUBLIC_ROOT_SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.HOMOLOG_NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  deploy:
    name: Deploy to VPS Homologação
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: homologacao

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: ~/podiotickets-frontend

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/podiotickets-frontend

            cat > .env <<EOF
            GHCR_IMAGE=${{ env.IMAGE_NAME }}
            ORGANIZER_APP_HOST=${{ secrets.ORGANIZER_APP_HOST }}
            ROOT_SITE_URL=${{ secrets.ROOT_SITE_URL }}
            EOF

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans

            docker image prune -f
