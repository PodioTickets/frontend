name: Deploy Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS Produção
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -e
            echo "🚀 Iniciando deploy produção frontend..."

            cat > .env <<EOF
            GHCR_IMAGE=podiotickets/podiotickets-frontend
            ORGANIZER_APP_HOST=${{ secrets.ORGANIZER_APP_HOST }}
            ROOT_SITE_URL=${{ secrets.ROOT_SITE_URL }}
            EOF

            echo "📥 Atualizando código..."
            git fetch origin
            git reset --hard origin/master

            # O .env de produção (com TODOS os NEXT_PUBLIC_*) vive somente na VM (untracked).
            # NÃO recriar aqui — o build local depende dele como build-args.
            if [ ! -f .env ]; then
              echo "❌ .env ausente na VM — abortando para não buildar com vars vazias."
              exit 1
            fi

            echo "🔨 Fazendo build (local na VPS, sem GHCR)..."
            DOCKER_BUILDKIT=1 docker compose build frontend

            echo "🚀 Subindo container..."
            docker ps -aq --filter name=podiotickets-frontend | xargs -r docker rm -f
            docker compose up -d --remove-orphans

            docker image prune -f

            echo "📋 Status:"
            docker compose ps

            echo "✅ Deploy concluído!"
