services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ORGANIZER_APP_HOST: ${NEXT_PUBLIC_ORGANIZER_APP_HOST}
        NEXT_PUBLIC_ROOT_SITE_URL: ${NEXT_PUBLIC_ROOT_SITE_URL}
        NEXT_PUBLIC_ADMIN_APP_HOST: ${NEXT_PUBLIC_ADMIN_APP_HOST}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    image: podiotickets-frontend-homolog:latest
    container_name: podiotickets-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ORGANIZER_APP_HOST: ${ORGANIZER_APP_HOST}
      ADMIN_APP_HOST: ${ADMIN_APP_HOST}
      ROOT_SITE_URL: ${ROOT_SITE_URL}
